# Render Blueprint (https://render.com/docs/blueprint-spec)
# Renderダッシュボードの Blueprints から、このファイルを含むリポジトリを指定して適用する。
# 手順の全体は docs/09-deployment.md を参照。
services:
  - type: web
    name: trpg-gm-app
    runtime: node
    plan: starter # 永続ディスクを付けるにはfree不可。starter($7/月)以上
    region: singapore # 日本から最も近いリージョン
    branch: main
    buildCommand: npm ci && npm run build
    # NODE_ENVはランタイム側だけに渡す。envVarsに置くとビルド時にも効いてしまい、
    # `npm ci` がdevDependenciesを省略してviteが入らずビルドが落ちる
    # (NODE_ENV=production は npm の omit=dev を意味する)。
    # アプリ自身の挙動はNODE_ENVではなくSECURE_COOKIES/STATIC_DIRで決まるので、
    # ここに置いても設定が隠れることはない。
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /ready
    # SQLiteとローカル画像を単一永続ディスクへ置くため、必ず1インスタンスで運用する。
    numInstances: 1
    disk:
      name: gmdesk-data
      mountPath: /data
      sizeGB: 5 # 場面挿絵PNGが増えるので、使用量を見て拡張する(縮小は不可)
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: DATA_DIR
        value: /data
      - key: SQLITE_PATH
        value: /data/gmdesk.sqlite3
      - key: MEDIA_DIR
        value: /data
      # 初回移行完了まではfilesystem。手順確認後、ダッシュボードでsqliteへ切り替える。
      - key: DATABASE_DRIVER
        sync: false
      - key: MAINTENANCE_MODE
        value: "off"
      # ビルド済みフロントの配信元。相対パスはリポジトリルート基準で解決される。
      - key: STATIC_DIR
        value: dist
      # セッションクッキーのSecure属性。HTTPS配信なので必ずtrue。
      - key: SECURE_COOKIES
        value: "true"
      # 以下は sync: false。ダッシュボードで手動設定する(リポジトリに値を置かない)
      - key: BASE_URL # 例: https://trpg-gm-app.onrender.com(末尾スラッシュなし)
        sync: false
      - key: GEMINI_TEXT_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        sync: false
      - key: GEMINI_IMAGE_API_KEY # 未設定なら挿絵機能はUIごと無効になる(任意)
        sync: false
      - key: GEMINI_IMAGE_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: LIMIT_MESSAGES_PER_DAY
        value: "200"
      - key: LIMIT_TEXT_TOKENS_PER_DAY
        value: "500000"
      - key: LIMIT_GLOBAL_TEXT_TOKENS_PER_DAY
        value: "5000000"
      - key: LIMIT_TEXT_CONCURRENT
        value: "6"
      - key: LIMIT_NOVELIZE_PER_DAY
        value: "10"
      - key: LIMIT_IMAGES_PER_DAY
        value: "30"
      - key: MAX_USER_STORAGE_BYTES
        value: "268435456"
      - key: MIN_FREE_STORAGE_BYTES
        value: "268435456"
      - key: STORAGE_WRITE_HEADROOM_BYTES
        value: "12582912"
