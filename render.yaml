# Render Blueprint (https://render.com/docs/blueprint-spec)
# Renderダッシュボードの Blueprints から、このファイルを含むリポジトリを指定して適用する。
# 手順の全体は docs/09-deployment.md を参照。
services:
  - type: web
    name: trpg-gm-app
    runtime: node
    plan: starter # 永続ディスクを付けるにはfree不可。starter($7/月)以上
    region: singapore # 日本から最も近いリージョン
    branch: main
    # NODE_ENV=production 環境下の `npm install` はdevDependenciesを省略するため、
    # ビルドに必要なvite/@vitejs/plugin-reactが入らずビルドが失敗する。
    # --include=dev を明示して回避する。
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config # 認証不要で200を返すエンドポイント
    # ファイルシステムを唯一の永続層として使う設計(server/storage/*)のため、
    # 複数インスタンスでのディスク共有はできない。必ず1インスタンスで運用する。
    numInstances: 1
    disk:
      name: gmdesk-data
      mountPath: /data
      sizeGB: 5 # 場面挿絵PNGが増えるので、使用量を見て拡張する(縮小は不可)
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /data
      # 以下は sync: false。ダッシュボードで手動設定する(リポジトリに値を置かない)
      - key: BASE_URL # 例: https://trpg-gm-app.onrender.com(末尾スラッシュなし)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY # 未設定なら挿絵機能はUIごと無効になる(任意)
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: LIMIT_MESSAGES_PER_DAY
        value: "200"
      - key: LIMIT_NOVELIZE_PER_DAY
        value: "10"
      - key: LIMIT_IMAGES_PER_DAY
        value: "30"
